<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>My Tailwind App</title>
</head>
<body>

    <h1 class="text-4xl font-bold text-blue-600">
        Hello Tailwind!
    </h1>
<div class="bg-green-500 text-white p-6 rounded-lg shadow-lg m-8">
    ✅ Tailwind CSS is working!
</div>
<h1 class="text-5xl font-bold text-blue-600 text-center mt-10">
    🚀 Tailwind CSS is Working!
</h1>
<div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-lg overflow-hidden p-6">
    <h2 class="text-2xl font-bold text-gray-800">Welcome</h2>
    <p class="text-gray-600 mt-2">
        This is a simple Tailwind card.
    </p>
</div>
<button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition">
    Click Me
</button>
<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
    ✅ Success! Tailwind CSS is working.
</div>
<div class="max-w-sm mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-4">Login</h2>

    <input
        type="email"
        placeholder="Email"
        class="w-full border rounded-lg p-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

    <input
        type="password"
        placeholder="Password"
        class="w-full border rounded-lg p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

    <button
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
        Sign In
    </button>
</div>

</body>
</html>
